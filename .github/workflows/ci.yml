name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, Mac ]
  pull_request:
    branches: [ main, Mac ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qal-reference-comparison:
    name: QAL Reference Comparison (Differential Parity & Bootstrap)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libsqlite3-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            qal/target
          key: ${{ runner.os }}-cargo-ref-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ref-

      - name: Check Reference Compilation
        run: cargo check --manifest-path qal/Cargo.toml --features qal-compiler/reference --all-targets

      - name: Differential Frontend Tests (Parser, Printer, Lexer)
        run: cargo test --manifest-path qal/Cargo.toml --features qal-compiler/reference --test frontend_diff

      - name: Differential Typechecker Tests (Checker, Unifier, Exhaustiveness)
        run: cargo test --manifest-path qal/Cargo.toml --features qal-compiler/reference --test checker_diff

      - name: Differential Codegen & Fixpoint Tests (WASM Lowering)
        run: cargo test --manifest-path qal/Cargo.toml --features qal-compiler/reference --test codegen_diff

      - name: Self-Hosted Bootstrap Fixpoint Verification (Stage 1 == Stage 2 == Stage 3)
        run: cargo test --manifest-path qal/Cargo.toml --features qal-compiler/reference --test full_fixpoint

  qal-autonomous-operation:
    name: QAL Autonomous Operation (Pure Self-Hosted CLI)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libsqlite3-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            qal/target
          key: ${{ runner.os }}-cargo-auto-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-auto-

      - name: Build Autonomous Release CLI (Zero Reference Dependencies)
        run: cargo build --manifest-path qal/Cargo.toml -p qal-cli --release

      - name: Verify Seed Integrity & Architectural Isolation
        run: |
          cargo test --manifest-path qal/Cargo.toml -p qal-run seed_module
          # Ensure no reference compiler symbols leaked into autonomous binary
          if nm qal/target/release/qal | grep -E "qal_text|qal_check|qal_wasm"; then
            echo "ERROR: Reference compiler symbols found in autonomous binary"
            exit 1
          fi

      - name: Autonomous CLI Integration Tests
        run: |
          cargo test --manifest-path qal/Cargo.toml -p qal-cli --release --test cli
          cargo test --manifest-path qal/Cargo.toml -p qal-cli --release --test mcp
          cargo test --manifest-path qal/Cargo.toml -p qal-cli --release --test todo_scenarios
          cargo test --manifest-path qal/Cargo.toml -p qal-cli --release --test shop_scenarios
          cargo test --manifest-path qal/Cargo.toml -p qal-cli --release --test team
          cargo test --manifest-path qal/Cargo.toml -p qal-cli --release --test concurrency
          cargo test --manifest-path qal/Cargo.toml -p qal-cli --release --test production

      - name: Autonomous Workspace Unit & Property Tests
        run: cargo test --manifest-path qal/Cargo.toml --workspace --no-fail-fast

  gen3-substrate-suite:
    name: Gen-3 AI-Native Substrate (TGS Engine)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Substrate Tests & JIT Verification
        run: |
          cd gen3
          cargo test --verbose

      - name: Execute TGS Benchmark
        run: |
          cd gen3
          cargo run --release -- bench

  igqk-python-suite:
    name: IGQK Quantum Compression & Multimodal Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision numpy scipy pytest PyWavelets matplotlib

      - name: Run IGQK Multimodal & Training Tests
        run: |
          python -m pytest IGQK_Complete_Package/igqk_v4/tests/test_multimodal.py
          python -m pytest IGQK_Complete_Package/igqk_v4/tests/test_training.py
