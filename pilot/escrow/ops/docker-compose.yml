services:
  escrow-service:
    build:
      context: ../../../
      dockerfile: pilot/escrow/ops/Dockerfile
    container_name: qal-escrow-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATA_DIR=/data
      - GATEWAY_PORT=8080
      - ESCROW_API_KEY=${ESCROW_API_KEY:?set ESCROW_API_KEY in the environment before starting}
      - REQUIRE_AUTH=true
      - RATE_LIMIT_RPS=50.0
      - RATE_LIMIT_BURST=100.0
    volumes:
      - escrow-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  escrow-data:
