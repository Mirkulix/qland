[package]
name = "qal-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Self-hosting test support (spec §10.1): the QAL corpus, a program generator and the 5a measurement gate. Test-only."

[dependencies]
qal-core = { workspace = true }
qal-compiler = { workspace = true }
qal-run = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
qal-compiler = { workspace = true, features = ["reference"] }

